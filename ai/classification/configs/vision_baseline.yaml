# Vision baseline: trains on Kaggle's free GPU, not on this machine.
#
# Local hardware, measured:
#   GPU  : none. Intel UHD Graphics 620 only; nvidia-smi absent on host
#          and container, no /dev/dxg, no /dev/nvidia*, no CUDA.
#   CPU  : i5-8350U, 4 physical cores / 8 threads @ 1.7 GHz
#   RAM  : ~7.1 GiB usable in the container
#
# So training runs remotely and only the artifact comes back. The
# DocumentClassifier contract already isolates the Django pipeline from
# where inference happens, so this changes nothing downstream.
#
#   ai/classification/training/  --submit-->  Kaggle GPU kernel
#                                                   |
#                                            model.pt + metrics.json
#                                                   |
#                             ai/classification/artifacts/<name>/<version>/
#                                                   |
#                                    inference adapter -> Django
#
# Run it:
#   python -m ai.classification.training.submit_kaggle --smoke   # cheap proof
#   python -m ai.classification.training.submit_kaggle --epochs 5
#
# Needs KAGGLE_USERNAME + KAGGLE_KEY, or ~/.kaggle/kaggle.json.

status: ready_untrained
model_name: document-classifier-vision
model_version: 0.1.0
architecture: resnet50

# ImageNet-pretrained ResNet-50 fine-tuned, rather than a CNN from
# scratch or a document transformer. It is the first baseline because it
# trains in a single Kaggle session and sits next to a published anchor
# (VGG16 at 90.24% on the official split, from the same paper as our
# 82.23% text anchor). DiT/LayoutLMv3 score higher and are the sensible
# second step, not the first.
compute:
  provider: kaggle
  accelerator: gpu
  session_limit_hours: 12
  weekly_quota_hours: 30

dataset:
  # Community re-uploads: convenient, but licence metadata is mostly
  # "Unknown" and the internal layout is NOT verified from here. The
  # training script therefore discovers the layout at runtime and fails
  # loudly rather than assuming a structure.
  kaggle_ref: chan814/rvl-cdip
  size_bytes: 38762871002
  alternatives:
    - shregar/doc-rvl-cdip-full     # 38.81 GB
    - uditamin/rvl-cdip-small       # 4.66 GB, faster first pass
    - gowtamsingulur/rvlcdip        # 4.66 GB, CC0
  canonical_source: https://huggingface.co/datasets/aharley/rvl_cdip
  licence_note: >-
    RVL-CDIP derives from IIT-CDIP / the UCSF Industry Documents Library.
    Verify the mirror's provenance before any redistribution.

training:
  epochs: 5
  batch_size: 64
  image_size: 224
  learning_rate: 0.0003
  optimizer: adamw
  scheduler: cosine
  mixed_precision: true
  # Scans are grayscale; replicated to 3 channels so ImageNet weights
  # stay usable rather than retraining the stem.
  grayscale_to_rgb: true

evaluation:
  report_per_class: true
  confusion_matrix: true
  measure_inference_latency: true

reference:
  published_image_vgg16_accuracy: 0.9024
  published_dit_large_accuracy: 0.9269
  # A subset or smoke run is a different experiment and is flagged
  # comparable=false in the emitted metadata automatically.
  comparable: false
