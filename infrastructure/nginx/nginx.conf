# Reverse proxy and TLS termination (spec §21.1, §26).
#
# TLS stops here: gunicorn speaks plain HTTP on the internal network and
# Django learns the original scheme from X-Forwarded-Proto, which is why
# SECURE_PROXY_SSL_HEADER is set in settings. Without that pairing Django
# sees http:// on the internal hop and redirects forever.

upstream backend {
    # Docker's embedded DNS returns every replica of the `backend` service,
    # so `docker compose up --scale backend=3` is picked up without editing
    # this file (spec §22 stage 2).
    #
    # least_conn rather than round-robin: request cost here is wildly
    # uneven - a document listing is milliseconds and a chat request runs
    # retrieval, reranking and an answerer - so distributing by connection
    # count tracks actual load, while round-robin would keep handing work to
    # an instance already busy with a slow one.
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# Rate limiting at the edge, in front of DRF's own throttles. The two are
# not redundant: DRF's limits are per user and require a request to be
# parsed and authenticated first, while this one costs nothing and applies
# to traffic that never gets that far.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
# Browser sign-in gets its own, wider zone. It is keyed per IP, and an
# institution's users often share one address (a campus NAT): 1 r/s would
# queue a whole lecture hall signing in at nine o'clock. Credential
# guessing is bounded per USERNAME by the application's own throttle.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;

# Plain HTTP exists only to redirect, and to answer ACME challenges so a
# certificate can be renewed without taking the site down.
server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${NGINX_SERVER_NAME};

    # Certbot's own layout, so there is ONE path for a certificate rather
    # than a bind-mounted directory that something has to copy into. The
    # bootstrap script writes a self-signed pair here first (nginx will not
    # start without one) and certbot overwrites it in place.
    ssl_certificate     /etc/letsencrypt/live/${NGINX_SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NGINX_SERVER_NAME}/privkey.pem;

    # TLS 1.2 is kept for older institutional clients; everything below it
    # is off. 1.3 is preferred by ordering.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers Django cannot set for static responses served by nginx itself.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Uploads are capped at 50 MB by the VALIDATION stage; rejecting a
    # larger body here means it is never written to disk at all.
    client_max_body_size 55m;

    # Long enough for OCR of a large scanned PDF to finish, since the
    # upload request itself does not wait for processing but a synchronous
    # download of a big file can.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Scripts authenticate here; one request a second is plenty for them.
    location = /api/auth/token/ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_params;
    }

    # Browser sign-in and password change: every endpoint that checks a
    # password is limited at the edge as well as per username behind it.
    location ~ ^/api/auth/(login|password)/$ {
        limit_req zone=login burst=20 nodelay;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/conf.d/proxy_params;
    }

    # Operational endpoints are not for the public internet. /metrics also
    # has an application-level allowlist (METRICS_ALLOWED_IPS); this is the
    # outer of the two gates.
    # Not served at the edge at all. Prometheus scrapes each backend
    # replica directly on the compose network (infrastructure/prometheus),
    # so nothing legitimate ever asks nginx for /metrics.
    #
    # This used to allow the RFC 1918 ranges. Measured on the production
    # stack under Docker Desktop, a request from outside arrived with the
    # Docker gateway's address (172.20.0.1) - private, so allowed - and any
    # NAT or proxy in front of nginx would do the same. "Looks internal" is
    # not a property an edge can check; "never exposed" is.
    location = /metrics {
        return 404;
    }

    location /health/ {
        access_log off;
        include /etc/nginx/conf.d/proxy_params;
    }

    # Readiness, for a load balancer in front of this one. Statuses only;
    # see config/health.py.
    location /ready/ {
        access_log off;
        include /etc/nginx/conf.d/proxy_params;
    }

    location /admin/ {
        include /etc/nginx/conf.d/proxy_params;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # MEDIA IS DELIBERATELY NOT SERVED HERE.
    #
    # Adding a `location /media/` alias would hand every uploaded document
    # to anyone who guesses a path, bypassing every access decision in
    # documents/authorization.py. Original files are reachable only through
    # the authenticated, audited /api/documents/{id}/download/ endpoint.

    # --- The frontend ------------------------------------------------------
    #
    # Built into this image (infrastructure/nginx/Dockerfile). Vite names
    # every asset by content hash, so a file under /assets/ can never change
    # under its name and is cached for a year; index.html is revalidated on
    # every load, so a deploy is picked up on the next navigation.

    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        include /etc/nginx/conf.d/security_headers;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Every other path is a client-side route (/documents/12, /ask/3) and
    # gets the application shell; the router renders the page. A path that
    # matches a real file - the favicon - is served as that file.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        include /etc/nginx/conf.d/security_headers;
        add_header Cache-Control "no-cache" always;
    }
}
