# Production overlay (spec §21.1).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# NOT auto-loaded: it must be named explicitly, so a developer running
# `docker compose up` never accidentally gets production behaviour, and a
# production deploy never silently inherits a developer's override.
#
# What this changes from the development stack:
#   * gunicorn instead of runserver (runserver is single-threaded, serves
#     static files insecurely, and Django itself says never to use it here)
#   * nginx terminating TLS in front
#   * no host port on Postgres or Redis - only nginx is published
#   * a bind-mounted backup directory, so dumps outlive the container
#   * the ML layer baked in, since a production deploy that cannot load its
#     own classifier is a deploy that silently skips classification

services:

  db:
    # !override, not `ports: []`. Compose MERGES sequences across files, so
    # an empty list appends nothing and leaves the base mapping in place -
    # it looks like it unpublishes the port and does not. Verified with
    # `docker compose config`.
    ports: !override []
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups

  redis:
    ports: !override []
    restart: unless-stopped
    # Redis holds throttle counters and the task queue, not documents, but
    # an open Redis is a remote code execution vector on many builds.
    command: redis-server --save 60 1 --appendonly yes

  # Migrations run ONCE, before anything serves traffic.
  #
  # They used to be in the backend start command, which is fine at one
  # replica and broken at three: `--scale backend=3` had all three racing
  # the same migration and the loser died with
  # `column "name" of relation "django_content_type" does not exist`.
  # A schema change is a deploy step, not something every replica attempts.
  migrate:
    # The image's unprivileged user. The development compose file runs as
    # root for its bind mounts; production must not.
    user: app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "true"
        INSTALL_LLM: "true"
        INSTALL_LOCAL: "true"
        INSTALL_S3: "${INSTALL_S3:-false}"
    command: python manage.py migrate --noinput
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    # The image's unprivileged user. The development compose file runs as
    # root for its bind mounts; production must not.
    user: app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "true"
        INSTALL_LLM: "true"
        INSTALL_LOCAL: "true"
        INSTALL_S3: "${INSTALL_S3:-false}"
    restart: unless-stopped

    # Every flag stays at the SAME indentation as `gunicorn`.
    #
    # In a YAML folded scalar (`>`), a line indented MORE than the first
    # content line is kept literal - its newline survives folding. With the
    # flags indented further, each one became its own shell command
    # ("sh: --bind: not found") and gunicorn fell back to its default bind
    # of 127.0.0.1, which nginx cannot reach. The stack came up and served
    # 502s.
    #
    # Migrations are NOT here: see the `migrate` service.
    command: >
      sh -c "python manage.py collectstatic --noinput &&
      exec gunicorn config.wsgi:application
      --config gunicorn.conf.py
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3}
      --threads ${GUNICORN_THREADS:-2}
      --timeout ${GUNICORN_TIMEOUT:-120}
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -"

    # Healthy once gunicorn answers /health/ - which is only after each
    # worker has warmed its models (post_worker_init), so nginx does not
    # route to a replica that would make the first user wait for a load.
    # The probe calls localhost over plain HTTP; /health/ is served ahead of
    # host validation and the HTTPS redirect precisely so this can work.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=5)",
        ]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s

    # !override, for the same reason `ports` needs it below. Compose MERGES
    # volume sequences across files, so listing the production volumes here
    # ADDED them to the base file's list rather than replacing it - and the
    # base file mounts ./backend over /app/backend. Production was running
    # the working tree, not the image, with this very comment sitting above
    # it claiming the opposite. Verified with `docker compose config`.
    #
    # The image is the artifact. Mounting the working tree over it is how a
    # deploy ends up running code nobody built.
    volumes: !override
      - media_data:/app/backend/media
      - static_data:/app/backend/staticfiles
      - ./ai/classification/artifacts:/app/ai/classification/artifacts:ro
      - ./backups:/backups
      # Model weights. `volumes: !override` drops the base file's mount, and
      # without this every container start re-downloads its models - a
      # network dependency at boot, which is exactly what the cache-first
      # loader exists to remove. Populate it with `manage.py warm_models`.
      - hf_cache:/app/.cache/huggingface

    # Reachable ONLY through nginx. With a plain `ports: []` this stayed
    # published on 8000 and the API was directly reachable with no TLS, no
    # edge rate limiting and no proxy headers - which is also how
    # SECURE_PROXY_SSL_HEADER gets its trust, so a direct caller could
    # assert X-Forwarded-Proto themselves.
    ports: !override []

    environment:
      DJANGO_DEBUG: "False"
      # The bind-mounted directory below. Unset, BACKUP_ROOT resolved to
      # /app/backups - root-owned in the image, so `manage.py backup` died
      # with PermissionError as the unprivileged user, and the documented
      # pre-upgrade backup was never taken.
      BACKUP_ROOT: /backups
      # Without this, /metrics reports whichever of the N gunicorn workers
      # answered the scrape - roughly 1/N of the traffic, understating
      # every error count and latency. tmpfs because the samples are
      # process state, not data: they must not survive the container.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      # nginx is the one proxy in front of gunicorn. Without this every
      # client has nginx's address as far as DRF's throttles can tell.
      DRF_NUM_PROXIES: "1"

    # Owner and mode are explicit because Docker's defaults only hold on a
    # container's FIRST start. Then the tmpfs is world-writable (1777); on
    # every restart after that - a crash under `restart: unless-stopped`, a
    # Docker daemon restart, a host reboot - Docker remounts it with the mode
    # of the mount point it left in the container layer: root-owned 0755.
    # The unprivileged user could no longer create its metric files, every
    # Django process died at import, and the API never came back. Measured:
    # the stack survived `up` and failed after the first reboot. 10001 is the
    # image's `app` user (Dockerfile).
    tmpfs:
      - /tmp/prometheus:uid=10001,gid=10001,mode=0700

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    # The image's unprivileged user. The development compose file runs as
    # root for its bind mounts; production must not.
    user: app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "true"
        INSTALL_LLM: "true"
        INSTALL_LOCAL: "true"
        INSTALL_S3: "${INSTALL_S3:-false}"
    restart: unless-stopped

    # --max-tasks-per-child recycles workers so a slow leak in a native
    # dependency (poppler and tesseract are both C) cannot accumulate across
    # thousands of documents.
    # Ingestion only. Low concurrency because OCR is CPU-bound: more
    # processes than cores makes every document slower, not the batch
    # faster. `--scale worker=N` adds processes on THIS host only; workers on
    # a second machine need shared Postgres, Redis and S3, which this overlay
    # does not provide (docs/release/multi-host-validation.md).
    command: >
      celery -A config worker
      --loglevel=INFO
      --queues=ingest
      --concurrency=${CELERY_CONCURRENCY:-2}
      --max-tasks-per-child=100

    # !override - see the backend service.
    volumes: !override
      - media_data:/app/backend/media
      - ./ai/classification/artifacts:/app/ai/classification/artifacts:ro
      - ./backups:/backups
      - hf_cache:/app/.cache/huggingface

    environment:
      DJANGO_DEBUG: "False"
      BACKUP_ROOT: /backups
      # Pipeline metrics live in this container's processes; served on
      # :9100 for Prometheus (config/celery.py). Not published to the host.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      CELERY_METRICS_PORT: "9100"

    # Explicit owner and mode for the reason given on the backend's tmpfs.
    tmpfs:
      - /tmp/prometheus:uid=10001,gid=10001,mode=0700

    # After `migrate`, like the backend. Recreated alongside it on an
    # upgrade, the workers otherwise started consuming the queue - new task
    # code - while the schema was still the old one.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Bulk RE-indexing (`manage.py reindex`); new uploads are chunked and
  # embedded by the ingest worker as part of their pipeline. Separate so a
  # re-index never sits in front of live uploads. The higher concurrency
  # suits a HOSTED embedding provider (the work is network-bound); with the
  # local model it is CPU-bound - set CELERY_INDEX_CONCURRENCY to the cores
  # you can spare, since each process also loads the model.
  worker-index:
    # The image's unprivileged user. The development compose file runs as
    # root for its bind mounts; production must not.
    user: app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "true"
        INSTALL_LLM: "true"
        INSTALL_LOCAL: "true"
        INSTALL_S3: "${INSTALL_S3:-false}"
    restart: unless-stopped

    command: >
      celery -A config worker
      --loglevel=INFO
      --queues=index
      --concurrency=${CELERY_INDEX_CONCURRENCY:-6}
      --max-tasks-per-child=200

    # !override - see the backend service.
    volumes: !override
      - media_data:/app/backend/media
      - ./ai/classification/artifacts:/app/ai/classification/artifacts:ro
      - hf_cache:/app/.cache/huggingface

    # Every setting comes from .env, like the other application services.
    # Without it this service had DJANGO_DEBUG alone: settings refused to
    # load with no secret key, the container restarted forever, and nothing
    # consumed the index queue - `manage.py reindex` queued work that never
    # ran.
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      CELERY_METRICS_PORT: "9100"

    tmpfs:
      - /tmp/prometheus:uid=10001,gid=10001,mode=0700

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    # Built, not pulled: the image carries the compiled frontend
    # (infrastructure/nginx/Dockerfile). Its typecheck and unit tests run
    # inside the build, so a frontend that fails them cannot be deployed.
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./infrastructure/nginx/proxy_params:/etc/nginx/conf.d/proxy_params:ro
      - ./infrastructure/nginx/security_headers:/etc/nginx/conf.d/security_headers:ro
      - letsencrypt:/etc/letsencrypt:ro
      - static_data:/var/www/static:ro
      - certbot_www:/var/www/certbot
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
    # No `command:` override. A shell wrapper here once stopped the image
    # from rendering its config template at all; the certificate reload
    # loop now lives in /docker-entrypoint.d/ (infrastructure/nginx/).
    depends_on:
      backend:
        condition: service_healthy

  # Renewal only. First issuance needs nginx already running, which is
  # the chicken-and-egg that infrastructure/init-letsencrypt.sh resolves -
  # run that once before the first `up`.
  #
  # Certbot exits after each attempt, so it is run in a sleep loop rather
  # than left resident. Twelve-hourly with a 30-day renewal window means a
  # single failed attempt is never load-bearing.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do certbot renew --webroot --webroot-path=/var/www/certbot;
      sleep 12h & wait $${!}; done"

  # Observability (§20). Part of the production overlay rather than an
  # opt-in profile: the overlay already has to be named explicitly, so
  # anyone running it is deploying for real and should be able to see what
  # the system is doing.
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    # Bound to LOOPBACK, not published to the world. A Grafana on the open
    # internet with a default password is a bigger hole than anything it
    # monitors; reach it over an SSH tunnel:
    #   ssh -L 3000:localhost:3000 <host>
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      # Nothing to sign up for and nobody to phone home to.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    depends_on:
      - prometheus

volumes:
  hf_cache:
  postgres_data:
  prometheus_data:
  grafana_data:
  media_data:
  static_data:
  certbot_www:
  letsencrypt:
