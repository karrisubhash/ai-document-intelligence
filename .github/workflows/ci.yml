# CI/CD pipeline (spec §21.2).
#
#   Git Push -> Lint -> Unit Tests -> Integration Tests -> Security Checks
#            -> AI Regression Evaluation -> Build Images -> Deploy Staging
#            -> Smoke Tests -> Production
#
# The stages run as separate jobs rather than one script so a failure names
# the gate that caught it. Deployment jobs are guarded by environments, which
# is what makes "deploy to production" a decision someone makes rather than a
# consequence of merging.
#
# NOTE: this workflow has never executed on GitHub - the repository has no
# remote. Every job's commands have been run locally against the same
# images and services (see docs/operations/ci.md for what was run and what
# was not), but treat the first real Actions run as the test of the YAML.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # Tests need a key but not a secret one - they run against a throwaway
  # database. Production keys come from the environment, never from here.
  # At least 50 characters with enough distinct ones, because the security
  # job runs `check --deploy --fail-level WARNING` and Django's security.W009
  # is a WARNING. The previous value was 48 characters, so that job failed on
  # its own placeholder - the check working exactly as intended, on a key that
  # was never going to be used for anything.
  DJANGO_SECRET_KEY: ci-only-not-a-production-secret-qZ8vK3mLp7RtWx2NbYc4Hj6Fs9Dg
  DJANGO_DEBUG: "False"
  POSTGRES_DB: ai_document_intelligence
  POSTGRES_USER: app_user
  POSTGRES_PASSWORD: ci-password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  REDIS_HOST: localhost
  REDIS_PORT: "6379"

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        # PINNED. This job gates every other job in the pipeline
        # (`needs: lint`), so an unpinned linter means a ruff release can
        # stop the tests, the security checks and the build from running,
        # on a morning when nobody changed any code. Upgrading is then a
        # deliberate commit that bumps this line and pyproject.toml
        # together.
        run: pip install ruff==0.16.8

      - name: Ruff
        # Rules come from pyproject.toml, not from ruff's defaults - same
        # reason.
        run: ruff check backend ai

      - name: Formatting
        run: ruff format --check backend ai

  tests:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    needs: lint

    # The real services, not mocks. Postgres carries pgvector because the
    # search tests exercise a real HNSW index - a sqlite stand-in would pass
    # while proving nothing about the query that actually runs.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_user"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: System packages
        # OCR and PDF rendering are native dependencies; without them the
        # ingestion tests skip rather than fail, which is worse.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils tesseract-ocr postgresql-client

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-ml.txt

      - name: Migration check
        # A model change without a migration passes every test and then
        # fails on deploy. This catches it here.
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Backend suite
        # From backend/, which is the top of the Django project. Run from the
        # repository root, discovery starts at '.', and backend/ has no
        # __init__.py - so not one backend test was collected and the step
        # reported only the ai/ tests, OK.
        run: python manage.py test --noinput
        working-directory: backend

      - name: AI suite
        # Stdlib-only by design, so it needs no ML install and no database.
        run: python -m unittest discover -s ai/classification/tests -t .
        env:
          PYTHONPATH: .

  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npx vite build
      - name: Dependency audit
        # Advisory, like pip-audit below: a new advisory in a transitive
        # build dependency should be seen, not block an unrelated fix.
        run: npm audit --omit=dev || true

  e2e:
    name: End-to-end (browser against a live stack)
    runs-on: ubuntu-latest
    needs: [tests, frontend]
    # The same browser suite that was run locally against the full stack
    # (frontend/e2e/platform.spec.ts). Here it runs on the offline
    # baselines - hashing embeddings, lexical reranking, extractive answers
    # - so it needs no model download and no API key, and exercises every
    # permission boundary, the pipeline and the UI exactly as configured.
    env:
      E2E_PASSWORD: ci-e2e-password-not-a-secret
      E2E_CHANNEL: chromium
      # The db service takes its name from INTERPOLATION, where this shell
      # environment beats .env; the backend reads .env. With the workflow's
      # POSTGRES_DB inherited here, Postgres created one database and the
      # backend asked for another, and the stack never came up.
      POSTGRES_DB: adi_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Environment for a disposable stack
        run: |
          cp .env.example .env
          cat >> .env <<'ENV'
          DJANGO_DEBUG=True
          DJANGO_SECRET_KEY=ci-e2e-only-not-a-production-secret-7Qm2Vx9Lp4Rt
          POSTGRES_DB=adi_e2e
          POSTGRES_USER=app_user
          POSTGRES_PASSWORD=ci-password
          DOCUMENT_EMBEDDING_PROVIDER=documents.processing.embedding.hashing.HashingEmbeddingProvider
          DOCUMENT_SCANNER=documents.processing.scanning.heuristic.HeuristicScanner
          DOCUMENT_FIELD_EXTRACTOR=documents.processing.field_extraction.rule_extractor.RuleFieldExtractor
          ENV

      - name: Start the stack
        run: |
          docker compose up -d --build db redis backend worker
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/ready/ && break
            sleep 3
          done
          curl -fsS http://localhost:8000/ready/

      - name: Seed test accounts
        run: docker compose exec -T backend python manage.py seed_e2e --password "$E2E_PASSWORD"

      - name: Frontend and browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          (npx vite --port 5173 --strictPort > vite.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://localhost:5173/ >/dev/null && break; sleep 1; done

      - name: Run the browser suite
        working-directory: frontend
        run: npx playwright test

      - name: Keep evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/e2e/.results

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color backend worker | tail -300

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          pip install -r backend/requirements.txt
          pip install bandit pip-audit

      - name: No document or database file can enter an image
        # backend/media holds uploaded documents. Before .dockerignore existed
        # every image carried whatever was in it on the build machine.
        run: |
          for path in backend/media backend/db.sqlite3 backend/venv .env; do
            grep -qxF "$path/" .dockerignore || grep -qxF "$path" .dockerignore || {
              echo ".dockerignore does not exclude $path"; exit 1; }
          done

      - name: Django deployment check
        # The gate phase 10 was built against: production settings must be
        # clean, not "clean except for the ones we got used to seeing".
        run: python backend/manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SECRET_KEY: ${{ env.DJANGO_SECRET_KEY }}
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_PRELOAD: "True"
          EMAIL_HOST: smtp.example.invalid

      - name: Static analysis
        run: bandit -r backend/documents backend/config -ll

      - name: Dependency audit
        # Advisory rather than blocking: a new CVE in a transitive dependency
        # should raise a flag, not stop an unrelated bugfix from shipping.
        run: pip-audit --requirement backend/requirements.txt || true

  ai-regression:
    name: AI regression evaluation
    runs-on: ubuntu-latest
    needs: tests
    # Only on the default branch: it needs an indexed corpus, and a PR from a
    # fork has no access to one.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_user"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr

      - name: Install
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-ml.txt

      - name: Migrate
        run: python backend/manage.py migrate --noinput

      # Spec §19.2: every change to retrieval, prompts, embeddings, rerankers
      # or LLM configuration is evaluated against a fixed benchmark, and the
      # result is compared to the previous one.
      #
      # This step is a placeholder until a governed evaluation set exists.
      # The harness, the metrics and --fail-on-regression are all built and
      # tested; what is missing is a dataset, and inventing one here would
      # produce a number that looks like a quality gate and is not.
      # The corpus is ingested through the REAL pipeline, so the benchmark
      # scores extraction, chunking, table detection and retrieval as they
      # are actually configured - not a fixture inserted straight into the
      # database. It also resolves benchmark.template.json into document
      # ids, which cannot be committed because a fresh database has none.
      - name: Seed the evaluation corpus
        run: python backend/manage.py seed_evaluation
        env:
          # The SAME embedder the evaluate step scores with. Without this the
          # seed indexed chunks with no provider configured - so no vectors
          # were written - and the next step embedded the QUERY with the
          # hashing provider and matched it against nothing. The benchmark
          # silently measured lexical retrieval alone while
          # `capture_configuration()` recorded "hashing-baseline" beside the
          # score, which is the one thing a stored configuration exists to
          # prevent.
          DOCUMENT_EMBEDDING_PROVIDER: documents.processing.embedding.hashing.HashingEmbeddingProvider

      # --baseline, not --compare-to. --compare-to takes a RUN ID, and a
      # fresh CI database has no previous run - so the gate ran the
      # benchmark and could never fail, whatever the scores were.
      - name: Evaluate against the committed baseline
        run: |
          python backend/manage.py evaluate \
            --load evaluation/benchmark.json \
            --dataset institutional-seed \
            --dataset-version v1 \
            --as-user ci-evaluator \
            --label "${GITHUB_SHA::7}" \
            --baseline evaluation/baseline.json \
            --fail-on-regression
        env:
          DOCUMENT_EMBEDDING_PROVIDER: documents.processing.embedding.hashing.HashingEmbeddingProvider

  build:
    name: Build images
    runs-on: ubuntu-latest
    # Every gate, including the browser suite and the AI regression gate.
    # Without the last two here, a failing regression gate ran beside a
    # deploy instead of stopping it. Both run on every push (pushes only
    # trigger on the default branch), so neither is ever skipped here.
    needs: [tests, security, frontend, e2e, ai-regression]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the web edge (nginx + compiled frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/nginx/Dockerfile
          push: false
          tags: ai-document-intelligence-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build (with the ML layer)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: INSTALL_ML=true
          tags: ai-document-intelligence:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Compose MERGES sequences across files, so an overlay that
      # re-declares `ports` or `volumes` ADDS to the base list instead of
      # replacing it. That has silently un-done two production guarantees
      # in this repo already - the API stayed published on 8000, and the
      # working tree stayed mounted over the image. Neither is visible by
      # reading the overlay; both are obvious in `docker compose config`.
      # This gate asserts the merged OUTCOME, so the whole class is caught
      # in CI rather than in production.
      - name: Production configuration
        run: python infrastructure/check_deployment_config.py

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "Deployment is environment-specific and intentionally not"
          echo "invented here - wire this to your host, registry or"
          echo "orchestrator. The gates above are what make it safe to."

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - name: Probe staging
        run: |
          BASE="${{ vars.STAGING_URL }}"
          if [ -z "$BASE" ]; then
            echo "STAGING_URL is not set; nothing to probe."
            exit 0
          fi
          # Health, then an endpoint that must REFUSE anonymous access -
          # a smoke test that only checks for a 200 cannot tell a working
          # deploy from one with authentication switched off.
          curl -fsS "$BASE/health/" | tee /dev/stderr | grep -q '"status": "healthy"'
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/documents/")
          test "$code" = "401" || test "$code" = "403"
          echo "smoke tests passed"

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: smoke
    # A protected environment: this is the approval gate, so production is a
    # decision someone makes rather than something merging causes.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Wire to your production target; gated on every job above."
