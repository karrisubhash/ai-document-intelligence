services:

  db:
    # Postgres 16 with the pgvector extension available. Same major
    # version as plain postgres:16, so an existing data volume is
    # compatible - the extension is enabled by a Django migration.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Off by default. Set INSTALL_ML=true to bake scikit-learn into the
        # image so a trained classifier can run in-process.
        INSTALL_ML: ${INSTALL_ML:-false}
        # Set INSTALL_LLM=true for the Anthropic SDK and boto3, which the
        # Bedrock embedding provider, reranker and answerer all need. The
        # API process needs it as much as the worker: search embeds the
        # QUERY, and reranking and answering both run in the request path.
        INSTALL_LLM: ${INSTALL_LLM:-false}
        # Local sentence-transformer models for semantic embeddings and
        # cross-encoder reranking. The heavy layer - torch - so it is
        # separate from INSTALL_LLM, which is only API clients.
        INSTALL_LOCAL: ${INSTALL_LOCAL:-false}

    # Development only. The image runs as an unprivileged user, but here
    # the source tree is bind-mounted from the host, and commands that
    # write into it (makemigrations, seed_evaluation) need the host's
    # permissions rather than uid 10001's. docker-compose.prod.yml pins the
    # unprivileged user back, and check_deployment_config.py asserts it.
    user: root

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - ./backend:/app/backend
      - ./evaluation:/app/evaluation
      - media_data:/app/backend/media
      # Trained model artifacts, read-only. Mounted at the path the
      # DOCUMENT_CLASSIFIER_ARTIFACT default already resolves to inside the
      # container (BASE_DIR.parent/ai/...), so enabling a classifier needs
      # no path configuration. Git-ignored on the host: an untrained
      # checkout mounts an empty directory, which is harmless because
      # DOCUMENT_CLASSIFIER is empty and the stage simply skips.
      - ./ai/classification/artifacts:/app/ai/classification/artifacts:ro
      # The document corpus, read-only, for `manage.py ingest_corpus`.
      # Bind-mounted rather than copied into the image: it is 12,000
      # files that belong to evaluation, not to the deployed artifact,
      # and baking them in would grow every image that never uses them.
      # Git-ignored, so an untrained checkout mounts an empty directory
      # and the command says so rather than half-ingesting.
      - ./ai/classification/data:/app/ai/classification/data:ro
      # Downloaded model weights. Without this, every rebuild
      # re-downloads the same 130 MB model on first use.
      - hf_cache:/app/.cache/huggingface

    ports:
      - "${APP_PORT}:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
        INSTALL_LLM: ${INSTALL_LLM:-false}
        # Local sentence-transformer models for semantic embeddings and
        # cross-encoder reranking. The heavy layer - torch - so it is
        # separate from INSTALL_LLM, which is only API clients.
        INSTALL_LOCAL: ${INSTALL_LOCAL:-false}

    # One worker for both queues in development - the separation is
    # about scaling them apart in production, not about needing two
    # processes on a laptop.
    # See the backend service: bind-mounted source, development only.
    user: root

    command: celery -A config worker --loglevel=INFO --queues=ingest,index

    volumes:
      - ./backend:/app/backend
      - ./evaluation:/app/evaluation
      - media_data:/app/backend/media
      # The worker is the process that actually runs the CLASSIFICATION
      # stage, so it needs the artifact at least as much as the API does.
      - ./ai/classification/artifacts:/app/ai/classification/artifacts:ro
      # The document corpus, read-only, for `manage.py ingest_corpus`.
      # Bind-mounted rather than copied into the image: it is 12,000
      # files that belong to evaluation, not to the deployed artifact,
      # and baking them in would grow every image that never uses them.
      # Git-ignored, so an untrained checkout mounts an empty directory
      # and the command says so rather than half-ingesting.
      - ./ai/classification/data:/app/ai/classification/data:ro
      # Downloaded model weights. Without this, every rebuild
      # re-downloads the same 130 MB model on first use.
      - hf_cache:/app/.cache/huggingface

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    # Optional, and off by default: `npm run dev` on the host is the
    # faster loop and the one the frontend README documents. This service
    # exists so the whole stack can come up on a machine without Node -
    #
    #   docker compose --profile frontend up
    #
    profiles: ["frontend"]

    image: node:22-alpine
    working_dir: /app

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    volumes:
      - ./frontend:/app
      # Keeps the container's Linux node_modules out of the host bind
      # mount, where a Windows or macOS install of the same packages
      # would otherwise be shadowed by - or shadow - this one.
      - frontend_node_modules:/app/node_modules

    environment:
      # Same origin, through Vite's proxy (vite.config.ts) - exactly as nginx
      # does in production. Pointing the browser at the API's own port
      # instead made every call cross-origin, and session cookies with
      # credentials "same-origin" and CORS credentials off are neither sent
      # nor stored cross-origin: nobody could sign in. Resolved by THIS
      # container, so it names the compose service.
      VITE_PROXY_TARGET: http://backend:8000

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    depends_on:
      - backend

volumes:
  hf_cache:
  postgres_data:
  media_data:
  frontend_node_modules:
